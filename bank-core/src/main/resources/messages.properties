# Messages d'erreur destinés a l'utilisateur (FR - defaut)
error.validation=Les donnees envoyees sont invalides.
error.resource.notfound=La ressource demandee est introuvable.
error.funds.insufficient=Le solde du compte est insuffisant pour realiser cette operation.
error.account.blocked=Ce compte est bloque. Merci de contacter votre conseiller.
error.operation.duplicate=Cette operation a deja ete traitee.
error.concurrent.update=La ressource a ete modifiee entre-temps. Merci de reessayer.
error.request.malformed=La requete est mal formee.
error.method.notallowed=Methode HTTP non autorisee pour cette ressource.
error.media.unsupported=Le format de contenu envoye n'est pas supporte.
error.auth.required=Authentification requise.
error.access.denied=Vous n'avez pas les droits necessaires pour cette action.
error.internal=Une erreur interne est survenue. Merci de contacter le support avec la reference indiquee.
error.service.unavailable=Le service est temporairement indisponible. Merci de reessayer plus tard.

